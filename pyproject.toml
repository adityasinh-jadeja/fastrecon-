[project]
name = "fastrecon"
version = "3.1.0"
description = "Automated security reconnaissance & vulnerability scanning framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Aditya Sinh Jadeja"},
]

dependencies = [
    "aiohttp==3.13.3",
    "dnspython>=2.6.0",
    "Flask==3.1.3",
    "Jinja2==3.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.5.0",
]

[project.scripts]
fastrecon = "main:main"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
